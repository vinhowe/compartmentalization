# Scaling ladder R2 (5x640), arm c1-padded. learning_rate is a PLACEHOLDER until the LR sweep lands.
#
# Generated by scripts/gen_ladder_v2_configs.py. Do not hand-edit: regenerate.
# Normative reference: docs/experimental-protocol.md
#
#   rung          R2  5x640  (d_head 64, d/L = 128)
#   trunk N       24.6M   <- the axis every power law is fit against
#   arm           c1-padded
#   vocab rows    131,073  (= vocab_size 131072 x n_compartments 1 + 1)
#   budget        30B tokens -> max_iters 14306 DERIVED at 2,097,152 tok/step
#   batch         16 x 128 = 2048 sequences = 2.097M tokens/step

config_version = 2

[data]
train_bin = "data/fineweb350B-bpe16384-nodedup/fineweb350b-nodedup_train_*.bin"
val_bin   = "data/fineweb350B-bpe16384-nodedup/fineweb350b-nodedup_val_*.bin"

[model]
n_layer = 5
n_head = 10
n_embd = 640
block_size = 1024
vocab_size = 131072
weight_tying = false
use_rope = true
rope_base = 10000.0

[training]
max_iters = 14306
batch_size = 16
gradient_accumulation_steps = 128
# MUST be false. Presets would retune batch/accum for VRAM and silently change
# tokens-per-optimizer-step out from under an exact token budget.
auto_batch_config = false
eval_interval = 250
eval_iters = 20
log_interval = 10
always_save_checkpoint = true
seed = 1024
checkpoint_naming = "tokens"
full_state_at_tokens = [27_000_000_000]

[optimizer]
learning_rate = 0.0004
weight_decay = 0

[lr]
schedule = "wsd"
warmup_iters = 300
decay_start_iter = 0
decay_end_iter = 0
# A tenth of peak. nanoGPT's inherited default 6e-5 can sit ABOVE our peak,
# which would turn the decay into a ramp UP; train.py rejects that at startup.
min_lr = 4e-05

[system]
compile = true
dtype = "bfloat16"

[logging]
wandb_log = true
wandb_project = "translation-compression"
wandb_run_name = "ladder-v2-r2-c1-padded"
wandb_group = "ladder-v2"

[experiment]
n_compartments = 1
compartment_scaling = "equal"
translation_ratio = 0
max_compartments = 16
assignment_horizon_examples = 292968448
use_compartment_embeddings = true
translation_mode = "standard"
translation_chunk_size = 4

# LR sweep arm: R4 c1 lr=0.003. Sets the LR rule for the whole ladder.
#
# Generated by scripts/gen_ladder_v2_configs.py. Do not hand-edit: regenerate.
# Normative reference: docs/experimental-protocol.md
#
#   rung          R4  8x1024  (d_head 64, d/L = 128)
#   trunk N       100.7M   <- the axis every power law is fit against
#   arm           c1
#   vocab rows    16,385  (= vocab_size 16384 x n_compartments 1 + 1)
#   budget        3B tokens -> max_iters 1431 DERIVED at 2,097,152 tok/step
#   batch         32 x 64 = 2048 sequences = 2.097M tokens/step

config_version = 2

[data]
train_bin = "data/fineweb350B-bpe16384-nodedup/fineweb350b-nodedup_train_*.bin"
val_bin   = "data/fineweb350B-bpe16384-nodedup/fineweb350b-nodedup_val_*.bin"

[model]
n_layer = 8
n_head = 16
n_embd = 1024
block_size = 1024
vocab_size = 16384
weight_tying = false
use_rope = true
rope_base = 10000.0

[training]
max_iters = 1431
batch_size = 32
gradient_accumulation_steps = 64
# MUST be false. Presets would retune batch/accum for VRAM and silently change
# tokens-per-optimizer-step out from under an exact token budget.
auto_batch_config = false
eval_interval = 143
eval_iters = 20
log_interval = 10
always_save_checkpoint = true
seed = 1024
checkpoint_naming = "tokens"
full_state_at_tokens = []

[optimizer]
learning_rate = 0.003
weight_decay = 0

[lr]
schedule = "wsd"
warmup_iters = 300
decay_start_iter = 1287
decay_end_iter = 1431
# A tenth of peak. nanoGPT's inherited default 6e-5 can sit ABOVE our peak,
# which would turn the decay into a ramp UP; train.py rejects that at startup.
min_lr = 0.0003

[system]
compile = true
dtype = "bfloat16"

[logging]
wandb_log = true
wandb_project = "translation-compression"
wandb_run_name = "ladder-v2-lrsweep-r4-c1-lr3e-3"
wandb_group = "ladder-v2-lrsweep"

[experiment]
n_compartments = 1
compartment_scaling = "equal"
translation_ratio = 0
max_compartments = 16
assignment_horizon_examples = 292968448
use_compartment_embeddings = true
translation_mode = "standard"
translation_chunk_size = 4

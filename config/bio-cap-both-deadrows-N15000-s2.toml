# Parameter-matched control for the bio capacity claim (BOTH, seed 2).
#
# Reviewers aQVL (W4) and tHG3 both raise the same confound: a compartmented
# model carries a 2V embedding/output matrix, so its measured cost might be the
# price of optimising a larger vocabulary rather than compartmentalisation.
# The published pair differs in BOTH variables at once:
#
#   BOTH shared        V = 50,257    ~35M params
#   BOTH compartmented 2V = 100,514  ~61M params
#
# This run holds parameters fixed and varies only compartmentalisation: the 2V
# table of the compartmented model, but trained on the SHARED data, so the upper
# 50,257 rows never receive gradient and stay at initialisation. Same dead-rows
# device already validated in 8-256-n8-deadwt-c1-1M.
#
# Seed pairing replicates the published runs exactly (appendix: "the same seed
# sequence for each condition"): data seed 42 -> training seed 64, data seed 2 ->
# training seed 2, data seed 3 -> training seed 3.

[data]
train_bin = "data/bio-cap-both-N15000-K10-T8-s2/bio_train_*.bin"
val_bin = ""

[model]
n_layer = 12
n_embd = 256
n_head = 8
block_size = 512
vocab_size = 100514
weight_tying = false
use_rope = true
rope_base = 10000.0

[training]
max_iters = 45000
batch_size = 32
gradient_accumulation_steps = 8
eval_interval = 500
eval_iters = 0
log_interval = 10
always_save_checkpoints = true
seed = 2

[optimizer]
learning_rate = 3e-4
weight_decay = 0.0

[lr]
decay_lr = true
warmup_iters = 1000
lr_decay_iters = 45000
min_lr = 3e-5

[system]
compile = true
dtype = "bfloat16"

[logging]
wandb_log = true
wandb_project = "translation-compression"
wandb_run_name = "bio-cap-both-deadrows-N15000-s2"
wandb_group = "bio-capacity"
wandb_notes = "param-matched control: 2V table, shared both data, upper V rows dead"

[experiment]
n_compartments = 1
compartment_scaling = "equal"
translation_ratio = 0
translation_ratio_mode = "absolute"
max_compartments = 16
use_compartment_embeddings = false
permute_tokens_per_compartment = false
permute_input_tokens_per_compartment = false

[data]
train_bin = "data/fineweb350B-dedup/fineweb_train_*.bin"
val_bin = "data/fineweb350B-dedup/fineweb_val_*.bin"
# train_bin = "data/random_V2048_L64_N2048000000_seed64/random_train_*.bin"

[model]
n_layer = 1
n_head = 8
n_embd = 32
block_size = 64
vocab_size = 50257
weight_tying = false

[training]
max_iters = 0.5e4
batch_size = 2048
gradient_accumulation_steps = 1
eval_interval = 500
always_save_checkpoints = true
eval_iters = 1
seed = 64
log_interval = 10

[optimizer]
learning_rate = 6e-4
# So adamw = adam
weight_decay = 0

[system]
compile = true
dtype = "bfloat16"

[logging]
wandb_log = true
wandb_project = "translation-compression"
wandb_run_name = "quick-test-for-supercomputer"
wandb_notes = "4 domains on FineWeb"
wandb_group = "small-multi-domain-prototypes"

[experiment]
weights = { "0" = 1.2, "1" = 1.2, "2" = 1.2, "3" = 1.2, "0>1" = 0.1, "1>0" = 0.1, "0>2" = 0.1, "2>0" = 0.1, "0>3" = 0.1, "3>0" = 0.1, "1>2" = 0.1, "2>1" = 0.1, "1>3" = 0.1, "3>1" = 0.1, "2>3" = 0.1, "3>2" = 0.1 }
max_compartments = 4
assignment_seed = 64
# shared_token_embeddings = true
use_compartment_embeddings = true
# copy_compartment_lm_head = true
permute_tokens_per_compartment = true

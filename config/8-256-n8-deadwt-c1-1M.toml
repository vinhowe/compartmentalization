# Reviewer control: c=1 dead-weight baseline at 8-256.
#
# Same architecture and compute as the paper's comp c=8 8-256 (composite vocab
# 8*16384 = 131072, 8 embedding tables, 8 lm_head slots), but ALL training
# tokens go to compartment 0 via compartment_scaling="single". Compartments
# 1..7 never receive training signal — with wd=0 they stay at init.
#
# Point: isolate "compartmentalization tax from optimizer working on 8x more
# params" (this control) from "compartmentalization tax from data being split
# across compartments" (the actual tax the paper claims). If this dead-wt run
# performs like the plain c=1 baseline (V=16k), the tax is from data split.
# If it performs like comp c=8, the tax is from parameter overhead.
#
# Compute per iter matches comp c=8 exactly (same body, same lm_head
# projection over 131k, same softmax, same optimizer work at wd=0).

[data]
source = "pretokenized"
train_bin = "data/fineweb350B-dedup-bpe16384/fineweb350b-dedup_train_*.bin"
val_bin = "data/fineweb350B-dedup-bpe16384/fineweb350b-dedup_val_*.bin"
uniform_seed = 64

[model]
n_layer = 8
n_head = 8
n_embd = 256
block_size = 64
vocab_size = 16384
weight_tying = false
use_rope = true
rope_base = 10000.0

[training]
max_iters = 1000000
eval_interval = 10000
eval_iters = 1
log_interval = 10
always_save_checkpoint = true
seed = 64
batch_size = 256
gradient_accumulation_steps = 8
auto_batch_config = false

[optimizer]
learning_rate = 2e-5
weight_decay = 0

[system]
compile = true
dtype = "bfloat16"

[logging]
wandb_log = true
wandb_project = "translation-compression"
wandb_run_name = "8-256-n8-deadwt-c1-1M"
wandb_group = "reviewer-controls"

[experiment]
n_compartments = 8
compartment_scaling = "single"
translation_ratio = 0.0
translation_ratio_mode = "compartment"
assignment_seed = 64
max_compartments = 16
use_compartment_embeddings = true
permute_tokens_per_compartment = false
permute_input_tokens_per_compartment = true

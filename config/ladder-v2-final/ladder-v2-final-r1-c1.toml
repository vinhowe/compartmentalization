# Scaling ladder R1 (4x512), arm c1. lr=0.0012, from the Pythia size schedule.
#
# Generated by scripts/gen_ladder_v2_configs.py. Do not hand-edit: regenerate.
# Normative reference: docs/experimental-protocol.md
#
#   rung          R1  4x512  (d_head 64, d/L = 128)
#   trunk N       12.6M   <- the axis every power law is fit against
#   arm           c1
#   vocab rows    16,385  (= vocab_size 16384 x n_compartments 1 + 1)
#   budget        30B tokens -> max_iters 14306 DERIVED at 2,097,152 tok/step
#   batch         64 x 32 = 2048 sequences = 2.097M tokens/step

config_version = 2

[data]
train_bin = "data/fineweb350B-bpe16384-nodedup/fineweb350b-nodedup_train_*.bin"
val_bin   = "data/fineweb350B-bpe16384-nodedup/fineweb350b-nodedup_val_*.bin"

[model]
n_layer = 4
n_head = 8
n_embd = 512
block_size = 1024
vocab_size = 16384
weight_tying = false
use_rope = true
rope_base = 10000.0

[training]
max_iters = 14306
batch_size = 64
gradient_accumulation_steps = 32
# MUST be false. Presets would retune batch/accum for VRAM and silently change
# tokens-per-optimizer-step out from under an exact token budget.
auto_batch_config = false
eval_interval = 250
eval_iters = 32
log_interval = 10
always_save_checkpoint = true
seed = 1024
checkpoint_naming = "tokens"
full_state_at_tokens = [27_000_000_000]

[optimizer]
learning_rate = 0.0012
weight_decay = 0.1

[lr]
schedule = "wsd"
warmup_iters = 300
decay_start_iter = 0
decay_end_iter = 0
# A tenth of peak. nanoGPT's inherited default 6e-5 can sit ABOVE our peak,
# which would turn the decay into a ramp UP; train.py rejects that at startup.
min_lr = 0.00012

[system]
compile = true
dtype = "bfloat16"

[logging]
wandb_log = true
wandb_project = "translation-compression"
wandb_run_name = "ladder-v2-final-r1-c1"
wandb_group = "ladder-v2-final"

[experiment]
n_compartments = 1
compartment_scaling = "equal"
translation_ratio = 0
max_compartments = 16
assignment_horizon_examples = 292968448
use_compartment_embeddings = false
translation_mode = "standard"
translation_chunk_size = 4

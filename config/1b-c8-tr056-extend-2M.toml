# 1B c=8 tr=0.056 extension from 1M → 2M iters.
#
# Reviewer-requested extension of the target-half validation loss vs training
# step curve. The original run (1b-8comp-bpe16384-correct) trained to 1M iters
# with compartment-mode tr=0.5 (effective tr = 0.5/9 ≈ 0.056). This config
# points at the same architecture/data/optimizer and resumes from the saved
# step-1000000 checkpoint.
#
# Caveat: original checkpoint is weights-only (no optimizer or data loader
# state). Adam moments and data loader position both reset on resume, so:
#   - transient loss bump for a few hundred iters until moments rebuild
#   - re-visits the first ~131B tokens (same seed → same shuffle order)
# These affect train dynamics but the val curve interpretation stays clean.

[data]
source = "pretokenized"
train_bin = "data/fineweb350B-dedup-bpe16384/fineweb350b-dedup_train_*.bin"
val_bin = "data/fineweb350B-dedup-bpe16384/fineweb350b-dedup_val_*.bin"
uniform_seed = 64

[model]
n_layer = 24
n_head = 56
n_embd = 1792
block_size = 64
vocab_size = 16384
weight_tying = false
use_rope = true
rope_base = 10000.0

[training]
max_iters = 2000000
eval_interval = 10000
eval_iters = 1
log_interval = 10
always_save_checkpoint = true
seed = 64
batch_size = 256
gradient_accumulation_steps = 8
auto_batch_config = false

[optimizer]
learning_rate = 2e-5
weight_decay = 0

[system]
compile = true
dtype = "bfloat16"

[logging]
wandb_log = true
wandb_project = "translation-compression"
wandb_run_name = "1b-c8-tr056-extend-2M"
wandb_group = "1b-scale"

[experiment]
n_compartments = 8
compartment_scaling = "equal"
translation_ratio = 0.5
translation_ratio_mode = "compartment"
assignment_seed = 64
max_compartments = 16
use_compartment_embeddings = true
permute_tokens_per_compartment = false
permute_input_tokens_per_compartment = true
